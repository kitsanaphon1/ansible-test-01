- name: Create Azure VM
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    resource_group: ansible-lab-rg
    location: Southeast Asia
    vm_name: ansible-test-vm
    admin_username: azureuser
    admin_password: "P@ssw0rd123!"  # ✅ ใช้ SSH key จะปลอดภัยกว่า
    vm_size: Standard_B1s
    image_offer: UbuntuServer
    image_publisher: Canonical
    image_sku: 20_04-lts
    image_version: latest

  tasks:
    - name: Create virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        name: "{{ vm_name }}-vnet"
        resource_group: "{{ resource_group }}"
        address_prefixes: "10.0.0.0/16"
        location: "{{ location }}"
        auth_source: env

    - name: Create subnet
      azure.azcollection.azure_rm_subnet:
        name: "{{ vm_name }}-subnet"
        resource_group: "{{ resource_group }}"
        virtual_network_name: "{{ vm_name }}-vnet"
        address_prefix: "10.0.1.0/24"
        auth_source: env

    - name: Create public IP address
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}"
        allocation_method: Static
        name: "{{ vm_name }}-publicip"
        location: "{{ location }}"
        auth_source: env

    - name: Create network interface card
      azure.azcollection.azure_rm_networkinterface:
        name: "{{ vm_name }}-nic"
        resource_group: "{{ resource_group }}"
        location: "{{ location }}"
        ip_configurations:
          - name: ipconfig1
            subnet: "{{ vm_name }}-subnet"
            virtual_network: "{{ vm_name }}-vnet"
            public_ip_address_name: "{{ vm_name }}-publicip"
        auth_source: env

    - name: Create the virtual machine
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ resource_group }}"
        name: "{{ vm_name }}"
        vm_size: "{{ vm_size }}"
        admin_username: "{{ admin_username }}"
        admin_password: "{{ admin_password }}"
        network_interfaces: "{{ vm_name }}-nic"
        image:
          offer: "{{ image_offer }}"
          publisher: "{{ image_publisher }}"
          sku: "{{ image_sku }}"
          version: "{{ image_version }}"
        location: "{{ location }}"
        state: present
        auth_source: env
